# SHARED FILE: owned by ModTemplate and copied in by `make sync`; never edit it in a mod repo.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install LuaJIT
        if: hashFiles('tests/*_test.lua') != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit

      - name: Conformance check
        run: python3 tools/modtool.py check --ci

      - name: Tests
        run: make test

      - name: Package
        run: make package
